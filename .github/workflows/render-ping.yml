name: Keep Render backend warm

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set"
            exit 1
          fi

          echo "Pinging $RENDER_URL"
          curl -fsS --retry 2 --retry-delay 5 "$RENDER_URL/api/webhooks/logs" || exit 1
